<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 오피스 상황판</title>
<style>
:root{
  --bg:#f5f2ec; --panel:#fffdf9; --ink:#2d2b27; --muted:#7a756b; --line:#e5dfd3;
  --ok:#2f8f5b; --ok-bg:#e3f3ea; --warn:#b7791f; --warn-bg:#fbf0dc; --bad:#c0392b; --bad-bg:#f9e2df;
  --idle:#8a877f; --idle-bg:#eceae4; --accent:#3f6b55; --accent-bg:#e2efe6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191a17; --panel:#22231f; --ink:#ece8de; --muted:#a39e92; --line:#373731;
    --ok:#5cc28a; --ok-bg:#1f3529; --warn:#e0a84a; --warn-bg:#3a2f1c; --bad:#ef7a6c; --bad-bg:#3d2320;
    --idle:#a39e92; --idle-bg:#302e29; --accent:#8fcfa8; --accent-bg:#233429;
  }
}
:root[data-theme="dark"]{
  --bg:#191a17; --panel:#22231f; --ink:#ece8de; --muted:#a39e92; --line:#373731;
  --ok:#5cc28a; --ok-bg:#1f3529; --warn:#e0a84a; --warn-bg:#3a2f1c; --bad:#ef7a6c; --bad-bg:#3d2320;
  --idle:#a39e92; --idle-bg:#302e29; --accent:#8fcfa8; --accent-bg:#233429;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
.wrap{max-width:1160px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:14px}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;margin:0 0 10px;font-weight:700}
.sub{color:var(--muted);font-size:13px}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:600}
.ok{color:var(--ok);background:var(--ok-bg)} .warn{color:var(--warn);background:var(--warn-bg)}
.bad{color:var(--bad);background:var(--bad-bg)} .idle{color:var(--idle);background:var(--idle-bg)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.summary{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.office{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:18px}
.office-head{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.ctrls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--panel);color:var(--muted);padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent);font-weight:700}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.scene{position:relative;background:linear-gradient(180deg,#eef3ee 0%,#f6f1e8 100%);transition:background .8s}
.scene[data-phase="dusk"]{background:linear-gradient(180deg,#f3dcc8 0%,#efe2d2 100%)}
.scene[data-phase="night"]{background:linear-gradient(180deg,#1e2438 0%,#2a2f42 100%)}
.clock{position:absolute;left:14px;top:10px;font-size:12px;font-weight:700;color:#5d6b60;background:rgba(255,255,255,.7);border-radius:999px;padding:2px 10px}
.scene[data-phase="night"] .clock{color:#d9def0;background:rgba(30,36,56,.7)}
svg.iso{width:100%;height:auto;display:block}
.iso text{font-family:inherit}
.iso .hit{cursor:pointer}
.iso .floorlabel{font-size:15px;font-weight:800;fill:#8c775a;opacity:.75;letter-spacing:.03em}
.iso .bub rect{filter:drop-shadow(0 2px 3px rgba(60,45,30,.18))}
.iso .bub text{font-size:11px;font-weight:700}

/* ----- characters ----- */
.chibi .torso,.chibi .head,.chibi .hand,.chibi .armL,.chibi .armR,.chibi .eyes,.chibi .mark,.chibi .steam path,.chibi .spark{transform-box:fill-box}
.chibi .torso{transform-origin:50% 100%;transition:transform .5s}
.chibi .head{transform-origin:50% 85%;transition:transform .5s}
.chibi .eyes{transition:transform .5s}
.chibi .closed{display:none}
.st-ok .torso{transform:rotate(-5deg)}
.st-bad .torso{transform:translateY(5px) rotate(7deg)}
.st-bad .eyes .open{display:none} .st-bad .closed{display:inline}
.look .chibi .head{transform:rotate(var(--look,0deg))}
.look .chibi .eyes{transform:translateX(var(--eye,0px))}
.look .st-bad .torso{transform:none}
@media (prefers-reduced-motion: no-preference){
  .st-work .armL{animation:type .32s ease-in-out infinite alternate;transform-origin:50% 0}
  .st-work .armR{animation:type .32s ease-in-out .16s infinite alternate;transform-origin:50% 0}
  @keyframes type{to{transform:translateY(2.5px)}}
  .st-ok .steam path{animation:steam 2.4s ease-in infinite;transform-origin:50% 100%}
  .st-ok .steam path:nth-child(2){animation-delay:1.2s}
  @keyframes steam{0%{opacity:0;transform:translateY(3px)}30%{opacity:.8}100%{opacity:0;transform:translateY(-9px)}}
  .st-warn .head{animation:tilt 2.8s ease-in-out infinite}
  @keyframes tilt{0%,100%{transform:rotate(0)}40%,60%{transform:rotate(10deg)}}
  .st-warn .mark{animation:bob 1.4s ease-in-out infinite alternate}
  @keyframes bob{to{transform:translateY(-3px)}}
  .st-bad .mark{animation:bob 2s ease-in-out infinite alternate}
  .st-new .armR{animation:wave .6s ease-in-out infinite alternate;transform-origin:50% 100%}
  @keyframes wave{from{transform:rotate(-150deg)}to{transform:rotate(-115deg)}}
  .st-new .spark,.st-plan .spark{animation:twinkle 1.6s ease-in-out infinite alternate}
  .die{animation:roll 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 50%}
  @keyframes roll{0%,70%{transform:rotate(0)}80%{transform:rotate(200deg) translateY(-4px)}90%,100%{transform:rotate(360deg)}}
  .cheer .armL,.cheer .armR{animation:cheer .7s ease-in-out infinite alternate}
  @keyframes cheer{to{translate:0 -2px}}
  @keyframes twinkle{from{opacity:.25;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
  .chibi .blink{animation:blink 4.5s infinite}
  @keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
  .leaf-sway{animation:sway 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
  @keyframes sway{to{transform:rotate(3deg)}}
}
.chibi .blink{transform-box:fill-box;transform-origin:50% 50%}
.st-new .armR{transform:rotate(-130deg);transform-origin:50% 100%}

.legend{display:flex;flex-wrap:wrap;gap:8px 16px;padding:9px 14px 11px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px}
.add{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:12px 14px;border-top:1px solid var(--line);font-size:13px}
.add label{display:flex;flex-direction:column;gap:3px;color:var(--muted);font-size:12px}
.add input,.add select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);min-width:120px}
.add .err{color:var(--bad);font-size:12.5px;width:100%;min-height:1em}
.add .hint{color:var(--muted);font-size:12px;width:100%}

.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.detail-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.detail-top h2{margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin:10px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.file{font-family:ui-monospace,Consolas,monospace;font-size:12.5px;background:var(--idle-bg);padding:1px 6px;border-radius:5px;word-break:break-all}
ul.items{margin:8px 0 0;padding-left:18px} ul.items li{margin:3px 0}
.brief{white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.7;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin:0}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent-bg);color:var(--accent);border-color:transparent;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi .l{font-size:12.5px;color:var(--muted)} .kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12.5px}
td.num{font-variant-numeric:tabular-nums}
td .pill{padding:2px 7px}
.stack{display:flex;flex-direction:column;gap:18px}
.todo{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.todo:last-child{border-bottom:0}
/* ----- 업무 흐름 보기 ----- */
.office.wide{width:min(1880px,calc(100vw - 32px));margin-left:50%;transform:translateX(-50%)}
.flowwrap[hidden],.scene[hidden],.legend[hidden],.add[hidden]{display:none}
.flowbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.flowkeys{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.flowkeys i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.flowscroll{overflow:auto;max-height:80vh;background:var(--bg);cursor:grab;touch-action:pan-x pan-y}
.flowscroll.drag{cursor:grabbing;user-select:none}
svg.flow{display:block}
.flow text{font-family:inherit}
.flow .fnode{cursor:pointer}
.flow .fnode .box{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.flow .fnode:hover .box{stroke:var(--muted)}
.flow .fnode.sel .box{stroke:var(--accent);stroke-width:2.4}
.flow .fnode.planned{opacity:.62}
.flow .fnode.planned .box{stroke-dasharray:6 4}
.flow .t1{font-size:13.5px;font-weight:700;fill:var(--ink)}
.flow .t2{font-size:11.5px;fill:var(--muted)}
.flow .tm{font-size:11.5px;font-weight:600}
.flow .colh{font-size:12px;font-weight:700;fill:var(--muted);letter-spacing:.04em}
.flow .lane{fill:var(--panel);opacity:.55}
.flow .lanet{font-size:12.5px;font-weight:800;fill:var(--muted)}
.flow .edge path.w{fill:none;stroke:#a9a294;stroke-width:1.8}
.flow .edge.dash path.w{stroke-dasharray:5 5}
.flow .edge .lb rect{fill:var(--panel);stroke:var(--line)}
.flow .edge .lb text{font-size:10.5px;fill:var(--muted)}
.flow .edge.hot path.w{stroke:var(--accent);stroke-width:2.6}
.flow .edge.hot .lb text{fill:var(--accent);font-weight:700}
.flow .dim,.flow .fnode.planned.dim{opacity:.13}
.flow .tray rect.chip{fill:var(--panel);stroke:var(--line);stroke-dasharray:4 3}
@media (prefers-reduced-motion: no-preference){
  .flow .edge.hot path.w{stroke-dasharray:7 5;animation:flowmove .9s linear infinite}
  @keyframes flowmove{to{stroke-dashoffset:-12}}
}
/* ----- 대표 결재함 (관제실) ----- */
.ctrl{margin-bottom:18px}
.ctrl-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.ctrl-head h2{margin:0}
.ctrl-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.ctrl-cols > div{min-width:0}
.ctrl h3{font-size:14px;margin:0 0 8px}
.grp{border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:8px}
.grp-t{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:2px}
.pick{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:14px;cursor:pointer}
.pick input{margin-top:4px;accent-color:var(--accent)}
.pick small{display:block;color:var(--muted);font-size:12px}
.pick.off{opacity:.45;cursor:default}
.ctrl-act{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.btn.main{background:var(--accent);color:var(--panel);border-color:var(--accent);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.pick input:focus-visible,.fin input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cmsg{font-size:13px;color:var(--accent)} .cmsg.err{color:var(--bad)}
.fin{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;flex-direction:column;gap:7px}
.fin-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px}
.fin-top b{word-break:break-all}
.fin-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fin input{flex:1 1 160px;min-width:0;font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.ctrl-off{font-size:13.5px;color:var(--muted)}
@media (max-width:820px){ .ctrl-cols{grid-template-columns:1fr} }
footer{margin-top:22px;font-size:12px;color:var(--muted);text-align:center}
@media (max-width:820px){ .grid{grid-template-columns:1fr} .kpis{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>AI 오피스 상황판</h1>
      <div class="sub" id="runline"></div>
    </div>
    <div class="summary" id="summary"></div>
  </header>

  <section class="office" aria-label="사무실 배치도">
    <div class="office-head">
      <span id="viewHint">사람·책상·라운지를 누르면 설명이 보여요 · 대표님을 누르면 직원들이 돌아봐요</span>
      <div class="ctrls">
        <div class="seg" role="group" aria-label="보기" id="viewSeg">
          <button type="button" data-v="office">사무실</button><button type="button" data-v="flow">업무 흐름</button>
        </div>
        <div class="seg" role="group" aria-label="조명" id="phaseSeg" data-office>
          <button type="button" data-p="auto">자동</button><button type="button" data-p="day">낮</button><button type="button" data-p="dusk">저녁</button><button type="button" data-p="night">밤</button>
        </div>
        <button class="btn" id="themeBtn" type="button">화면 밝기 전환</button>
      </div>
    </div>
    <div class="scene" id="scene"><span class="clock" id="clock"></span><svg class="iso" id="iso" role="img" aria-label="북유럽 온실 사무실 배치도"></svg></div>
    <div class="flowwrap" id="flowWrap" hidden>
      <div class="flowbar">
        <div class="flowkeys" id="flowKeys"></div>
        <div class="ctrls"><button class="btn" type="button" id="fzOut" aria-label="작게">−</button><button class="btn" type="button" id="fzIn" aria-label="크게">+</button><button class="btn" type="button" id="fzFit">전체 보기</button><button class="btn" type="button" id="fzClear">강조 지우기</button></div>
      </div>
      <div class="flowscroll" id="flowScroll"><svg class="flow" id="flow" role="img" aria-label="직원과 업무의 연결 흐름도"></svg></div>
    </div>
    <div class="legend" id="legend"></div>
    <form class="add" id="addForm" novalidate>
      <label>부서<select id="addDept"></select></label>
      <label>이름<input id="addName" maxlength="8" placeholder="예: 검색윤"></label>
      <label>직함<input id="addRole" maxlength="16" placeholder="예: 보드게임 검색"></label>
      <button class="btn" type="submit">책상 추가 (미리보기)</button>
      <button class="btn" type="button" id="resetBtn">미리보기 지우기</button>
      <div class="err" id="addErr" role="alert"></div>
      <div class="hint">미리보기는 저장되지 않아요. 실제 직원은 업무 분장표를 만들면 매일 아침 게시물에 자동으로 들어와 책상이 생겨요.</div>
    </form>
  </section>

  <section class="card ctrl" id="ctrlRoom" aria-label="대표 결재함"></section>

  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="stack">
      <section class="card" id="detail" aria-live="polite"></section>
      <section class="card">
        <h2>오늘 브리핑</h2>
        <div class="tabs" role="tablist" id="briefTabs"></div>
        <pre class="brief" id="briefBody"></pre>
      </section>
    </div>
    <div class="stack">
      <section class="card">
        <h2>최근 실행 기록</h2>
        <table><thead><tr><th>시각</th><th>방식</th><th>결과</th><th>걸린 시간</th></tr></thead><tbody id="runs"></tbody></table>
      </section>
      <section class="card">
        <h2>사무실 점검</h2>
        <div id="checks"></div>
      </section>
    </div>
  </div>

  <footer><span id="dataNote"></span> · 보기 전용 화면이라 사무실 업무에 영향을 주지 않습니다</footer>
</div>

const TW = 44, TH = 22, ZH = 26;
const P = (x, y, z=0) => [ (x - y) * TW / 2, (x + y) * TH / 2 - z * ZH ];

const pts = a => a.map(p => p.map(f1).join(",")).join(" ");

  return poly([P(x,y+d,z+h),P(x+w,y+d,z+h),P(x+w,y+d,z),P(x,y+d,z)], left) +
         poly([P(x+w,y,z+h),P(x+w,y+d,z+h),P(x+w,y+d,z),P(x+w,y,z)], right) +
         poly([P(x,y,z+h),P(x+w,y,z+h),P(x+w,y+d,z+h),P(x,y+d,z+h)], top, e);

function potBox(x, y, s, h, kind) { const k = { t:[C.pot, C.potL, C.potR], w:[C.potW, C.potWL, C.potWR], g:[C.potG, C.potGL, C.potGR] }[kind || "w"]; return shadow(x, y, s, s) + box(x, y, 0, s, s, h, ...k); }

    if (st === "ok") accSt = `<g transform="translate(14,-12)"><rect x="-3.5" y="-6" width="7" height="8" rx="2" fill="#f7f4ee" stroke="#d9d2c4"/><path d="M3.5,-4 q3,1 0,4" stroke="#d9d2c4" fill="none"/><g class="steam"><path d="M-1,-9 q-2,-3 0,-6 q2,-3 0,-6" stroke="#b9b2a5" stroke-width="1.2" fill="none"/><path d="M2,-9 q-2,-3 0,-6 q2,-3 0,-6" stroke="#b9b2a5" stroke-width="1.2" fill="none"/></g></g>`;
    if (st === "warn") accSt = `<g class="mark"><circle cx="16" cy="-58" r="8" fill="#fff4d8" stroke="#e7b54d"/><text x="16" y="-54" text-anchor="middle" font-size="11" font-weight="800" fill="#b7791f">?</text></g>`;
    if (st === "bad") accSt = `<g class="mark"><ellipse cx="0" cy="-64" rx="11" ry="5" fill="#cfd5de"/><circle cx="-5" cy="-66" r="5" fill="#cfd5de"/><circle cx="4" cy="-67" r="6" fill="#cfd5de"/><path d="M-5,-58 l-2,5 M0,-58 l-2,5 M5,-58 l-2,5" stroke="#8fa4c4" stroke-width="1.2"/></g>`;
    if (st === "new") accSt = `<g class="spark"><path d="M17,-54 l2,5 5,2 -5,2 -2,5 -2,-5 -5,-2 5,-2z" fill="#f6cf74"/></g>`;
    if (st === "plan") accSt = `<g class="spark"><path d="M17,-52 q-6,-2 -6,-8 q6,0 6,8z" fill="${C.g3}"/><path d="M17,-52 q6,-3 7,-9 q-7,1 -7,9z" fill="${C.g1}"/><path d="M17,-52 v5" stroke="${C.g1}" stroke-width="1.4"/></g>`;
  }
  const cards = opts.cards ? `<g transform="translate(13,-40)">${[-12,-4,4].map((r, i) => `<rect x="-4" y="-10" width="8" height="11" rx="1.5" transform="rotate(${r * 1.6} 0 2)" fill="${["#fbf7ef","#f6efe0","#fbf7ef"][i]}" stroke="#d6cbb5"/>`).join("")}</g>` : "";
  const chair = opts.noChair ? "" : `<rect x="-16" y="-44" width="32" height="40" rx="11" fill="${C.chairS}"/><rect x="-14" y="-42" width="28" height="36" rx="10" fill="${C.chair}"/>`;
  const classes = `chibi st-${opts.decor ? "decor" : st}${pose === "cheer" ? " cheer" : ""}`;
  return `<g class="${classes}" style="--look:${look.rot}deg;--eye:${look.eye}px" transform="translate(${f1(cx)},${f1(cy)}) scale(${s})">
    ${back ? "" : chair}<g class="torso">${under}${torso}${back ? "" : arms}<g class="head">${face}</g>${back ? arms : ""}</g>${back ? `<rect x="-15" y="-10" width="30" height="18" rx="8" fill="${C.chairS}"/><rect x="-13" y="-8" width="26" height="14" rx="7" fill="${C.chair}"/>` : ""}${cards}${accSt}</g>`;
}

function bubble(cx, top, st, label) {
  const w = [...label].reduce((a, c) => a + (c.charCodeAt(0) > 255 ? 11.5 : 6.8), 0) + 16, h = 20;
  const x = cx - w / 2, y = top - h - 7;
  return `<g class="bub"><rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${h}" rx="10" fill="${ST_BG[st]}" stroke="${ST_COLOR[st]}" stroke-opacity=".5"/>` +
    `<polygon points="${f1(cx - 4)},${f1(y + h - .5)} ${f1(cx + 4)},${f1(y + h - .5)} ${f1(cx)},${f1(y + h + 5)}" fill="${ST_BG[st]}"/>` +
    `<text x="${f1(cx)}" y="${f1(y + 14)}" text-anchor="middle" fill="${ST_COLOR[st]}">${esc(label)}</text></g>`;
}

function desk(dx, dy, st, empty) {
  const scr = SCREEN[empty ? "empty" : st] || SCREEN.idle, [mx, my] = P(dx + 1.55, dy + .45, .7);
  return shadow(dx, dy, 2, .9) + box(dx, dy, 0, 2, .9, .7, C.deskT, C.deskL, C.deskR) +
    box(dx + .55, dy + .12, .7, .95, .16, .55, C.mon, scr, C.monS, false) +
    `<rect x="${f1(mx - 3)}" y="${f1(my - 6)}" width="6" height="6" rx="1.5" fill="${empty ? "#e9e4da" : "#f6f2ea"}" stroke="#d9d2c4"/>` +
    (empty ? "" : (() => { const [px, py] = P(dx + .25, dy + .5, .7); return `<rect x="${f1(px - 3.5)}" y="${f1(py - 6)}" width="7" height="6" rx="1.5" fill="${C.potW}" stroke="#e0dbd0"/>` + leafBall(px, py - 9, 6, [C.g2, C.g1, C.g3]); })());
}

/* ----- 배치: 1열 [라운지 · 대표실 · 그린 라운지], 2열부터 본부별로 3팀씩 ----- */
const COLW = 8, GAPX = 1.4, GAPY = 2.4, PER = 2, DROW = 2.6;
function layout(staff) {
  const depts = OFFICE_DATA.departments;
  const rows = [[{ id:"lounge", kind:"lounge", name:"탕비실 · 보드게임 라운지" }, { id:"exec", kind:"exec", name:"대표실" }, { id:"garden", kind:"garden", name:"그린 라운지" }]];
  for (const div of [...new Set(depts.map(d => d.division))]) {
    const ds = depts.filter(d => d.division === div);
    for (let i = 0; i < ds.length; i += 3) rows.push(ds.slice(i, i + 3).map(d => ({ ...d, kind:"dept" })));
  }
  for (const r of rows) for (const z of r) {
    if (z.kind !== "dept") { z.d = 6.2; continue; }
    z.members = staff.filter(s => s.dept === z.id);
    z.slots = Math.max(z.minDesks || 1, z.members.length);
    z.deskRows = Math.ceil(z.slots / PER);
    z.d = 4.4 + (z.deskRows - 1) * DROW;
  }
  const W = 3 * COLW + 2 * GAPX + 2.4;
  let y = 1.4;
  for (const r of rows) {
    const rd = Math.max(...r.map(z => z.d)), off = (3 - r.length) * (COLW + GAPX) / 2;
    r.forEach((z, i) => { z.x = 1.2 + off + i * (COLW + GAPX); z.y = y; z.w = COLW; z.d = rd; });
    y += rd + GAPY;
  }
  return { zones: rows.flat(), rows, W, D: y + .2 };
}

function phaseNow() {
  if (phaseMode !== "auto") return phaseMode;
  const h = new Date().getHours();
  return h >= 6 && h < 17 ? "day" : h >= 17 && h < 19 ? "dusk" : "night";
}

function render() {
  const staff = [...OFFICE_DATA.staff, ...previews];
  const { zones, rows, W, D } = layout(staff);
  const WALL = 2.9, phase = phaseNow();
  const exec = zones.find(z => z.id === "exec");
  const ceoX = P(exec.x + 4, exec.y + 1.6)[0];
  let back = "", floor = "", objs = [], bubs = [];
  const add = (depth, svg) => objs.push({ depth, svg });

  /* 바닥 */
  back += box(0, 0, -.4, W, D, .4, C.floor, C.base1, C.base2, false);
  for (let j = .5; j < D; j += .5) back += `<line x1="${f1(P(0,j)[0])}" y1="${f1(P(0,j)[1])}" x2="${f1(P(W,j)[0])}" y2="${f1(P(W,j)[1])}" stroke="${C.plank}" stroke-width="1"/>`;
  for (let j = 0; j < D; j += .5) { const off = (j * 2) % 3; for (let i = 1 + off; i < W; i += 3) back += `<line x1="${f1(P(i,j)[0])}" y1="${f1(P(i,j)[1])}" x2="${f1(P(i,j + .5)[0])}" y2="${f1(P(i,j + .5)[1])}" stroke="${C.plank}" stroke-width="1"/>`; }

  /* 온실 유리벽 */
  const [sk1, sk2] = SKY[phase];
  back += `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sk1}"/><stop offset="1" stop-color="${sk2}"/></linearGradient>
    <radialGradient id="poolGrad"><stop offset="0" stop-color="#ffd58a" stop-opacity=".75"/><stop offset="1" stop-color="#ffd58a" stop-opacity="0"/></radialGradient></defs>`;
  back += poly([P(0,0,WALL),P(W,0,WALL),P(W,0,0),P(0,0,0)], C.frame) + poly([P(0,0,WALL),P(0,D,WALL),P(0,D,0),P(0,0,0)], C.frameS);
  const nX = Math.floor((W - .6) / 2.2), pw = (W - .6) / nX, nY = Math.floor((D - .6) / 2.2), ph = (D - .6) / nY;
  for (let i = 0; i < nX; i++) { const a = .3 + i * pw + .08, b = .3 + (i + 1) * pw - .08; back += poly([P(a,0,WALL - .15),P(b,0,WALL - .15),P(b,0,.35),P(a,0,.35)], "url(#sky)") + `<line x1="${f1(P(a,0,1.5)[0])}" y1="${f1(P(a,0,1.5)[1])}" x2="${f1(P(b,0,1.5)[0])}" y2="${f1(P(b,0,1.5)[1])}" stroke="${C.frame}" stroke-width="2"/>`; }
  for (let i = 0; i < nY; i++) { const a = .3 + i * ph + .08, b = .3 + (i + 1) * ph - .08; back += poly([P(0,a,WALL - .15),P(0,b,WALL - .15),P(0,b,.35),P(0,a,.35)], "url(#sky)", `opacity=".9"`) + `<line x1="${f1(P(0,a,1.5)[0])}" y1="${f1(P(0,a,1.5)[1])}" x2="${f1(P(0,b,1.5)[0])}" y2="${f1(P(0,b,1.5)[1])}" stroke="${C.frameS}" stroke-width="2"/>`; }
  if (phase === "night") for (let i = 0; i < 34; i++) { const t = (i * 37) % 100 / 100, h = (i * 53) % 60 / 100; const [sx, sy] = P(.5 + t * (W - 1), 0, WALL - .4 - h * 1.6); back += `<circle cx="${f1(sx)}" cy="${f1(sy)}" r="${i % 4 ? .9 : 1.4}" fill="#fff6d8" opacity=".85"/>`; }
  back += poly([P(0,0,WALL),P(W,0,WALL),P(W,-.3,WALL + .12),P(-.3,-.3,WALL + .12),P(-.3,D,WALL + .12),P(0,D,WALL)], C.frameT);
  for (let i = 0; i <= W + .01; i += pw) back += `<line x1="${f1(P(i,0,WALL)[0])}" y1="${f1(P(i,0,WALL)[1])}" x2="${f1(P(i,0,0)[0])}" y2="${f1(P(i,0,0)[1])}" stroke="${C.frame}" stroke-width="2.4"/>`;
  /* 벽 화단 */
  back += box(.6, .15, 0, W - 1.2, .45, .35, "#7aa57f", C.whiteL, C.whiteR);
  for (let i = 1; i < W - 1; i += 1.0) { const [cx, cy] = P(i, .37, .35); back += leafBall(cx, cy - 2, 9, [C.g4, C.g2, C.g1, C.g3]); }
  back += box(.15, .8, 0, .45, D - 1.5, .35, "#7aa57f", C.whiteL, C.whiteR);
  for (let j = 1.2; j < D - .8; j += 1.0) { const [cx, cy] = P(.37, j, .35); back += leafBall(cx, cy - 2, 9, [C.g4, C.g2, C.g1, C.g3]); }
  for (let i = 2.5; i < W - 1.5; i += 3.2) back += hangingPlant(i, .9, WALL - .5, 30 + (i * 7) % 14);
  for (let j = 3; j < D - 2; j += 4.2) back += hangingPlant(.9, j, WALL - .5, 32);

  for (const z of zones) {
    const rug = C.rug[z.kind === "dept" ? (z.planned ? "side" : "fin") : z.kind];
    floor += poly([P(z.x,z.y),P(z.x + z.w,z.y),P(z.x + z.w,z.y + z.d),P(z.x,z.y + z.d)], rug[0], `stroke="${rug[1]}" stroke-width="${z.planned ? 2 : 3}" ${z.planned ? 'stroke-dasharray="7 5"' : ""} stroke-linejoin="round" class="${z.kind !== "dept" ? "hit" : ""}" ${z.kind !== "dept" ? `data-id="${z.id}"` : ""}`);
    if (!z.planned) floor += poly([P(z.x + .3,z.y + .3),P(z.x + z.w - .3,z.y + .3),P(z.x + z.w - .3,z.y + z.d - .3),P(z.x + .3,z.y + z.d - .3)], "none", `stroke="${rug[1]}" stroke-width="1" opacity=".7"`);
    const label = z.planned ? `${z.name} · ${(z.members || []).some(m => m.active) ? "일부 가동" : "준비 중"}` : z.name;
    { const [lx0, ly0] = P(z.x + z.w, z.y), lx = lx0 - 34, ly = ly0 + 8, lw = [...label].reduce((a, c) => a + (c.charCodeAt(0) > 255 ? 12.5 : 6.5), 0) + 18;
      bubs.unshift(`<g class="zlabel"><rect x="${f1(lx - lw / 2)}" y="${f1(ly - 10)}" width="${f1(lw)}" height="20" rx="10" fill="#fffdf8" fill-opacity=".95" stroke="${rug[1]}" stroke-width="1.5" ${z.planned ? 'stroke-dasharray="4 3"' : ""}/><text x="${f1(lx)}" y="${f1(ly + 4)}" text-anchor="middle" font-size="12" font-weight="700" fill="#6b5c45">${esc(label)}</text></g>`); }
    floor += lightPool(z.x + z.w / 2, z.y + z.d / 2, 3.2);

    if (z.kind === "exec") {
      const dx = z.x + (z.w - 3.2) / 2, dy = z.y + 2.0;
      add(z.x + z.y + 1, box(z.x + .5, z.y + .35, 0, 1.8, .5, .95, C.execT, C.execL, C.execR) + (() => { const [bx, by] = P(z.x + 1.2, z.y + .6, .95); return `<rect x="${f1(bx - 10)}" y="${f1(by - 14)}" width="7" height="12" rx="1" fill="#7d9bb5"/><rect x="${f1(bx - 2)}" y="${f1(by - 16)}" width="6" height="14" rx="1" fill="#d9b56b"/><rect x="${f1(bx + 5)}" y="${f1(by - 12)}" width="6" height="10" rx="1" fill="#c07a63"/>` + leafBall(bx + 18, by - 10, 8, [C.g2, C.g1, C.g3]); })());
      add(z.x + z.w + z.y, monstera(z.x + z.w - 1.3, z.y + .5, 1.15));
      add(z.x + z.y + 4.5, fiddle(z.x + .5, z.y + 4.2));
      add(z.x + z.w + z.y + 4, snake(z.x + z.w - 1.0, z.y + 4.6));
      const ceo = { ...OFFICE_DATA.ceo, id:"ceo", status:"ceo" };
      const [cx, cy] = P(dx + 1.6, dy - .35, .85);
      add(dx + dy + 1.2, `<g class="hit" data-id="ceo">${chibi(ceo, cx, cy, 1.15, { rot:0, eye:0 })}</g>`);
      add(dx + dy + 2.2, `<g class="hit" data-id="ceo">${shadow(dx, dy, 3.2, 1.2)}${box(dx, dy, 0, 3.2, 1.2, .75, C.execT, C.execL, C.execR)}` +
        box(dx + .35, dy + .15, .75, .9, .16, .55, C.mon, "#a9d3e8", C.monS, false) + box(dx + 1.75, dy + .15, .75, .9, .16, .55, C.mon, "#a9d3e8", C.monS, false) +
        (() => { const [px, py] = P(dx + 2.9, dy + .75, .75); return `<rect x="${f1(px - 4)}" y="${f1(py - 7)}" width="8" height="7" rx="2" fill="${C.potW}"/>` + leafBall(px, py - 11, 8, [C.g2, C.g1, C.g3]); })() + `</g>`);
      if (selId === "ceo") floor += `<ellipse cx="${f1(P(dx + 1.6, dy + .3)[0])}" cy="${f1(P(dx + 1.6, dy + .3)[1])}" rx="78" ry="34" fill="none" stroke="#3f6b55" stroke-width="2" stroke-dasharray="5 4" opacity=".7"/>`;
      bubs.push(bubble(cx, cy - 56 * 1.15, "ceo", "대표 (나)"));
      continue;
    }

    if (z.kind === "lounge") {
      /* 탕비실: 흰 수납장 + 원목 상판, 커피머신, 머그, 냉장고 */
      const kx = z.x + .4, ky = z.y + .3;
      add(kx + ky + 2.6, box(kx, ky, 0, 4.4, .75, .9, "#e0c49a", C.whiteL, C.whiteR) +
        box(kx + 3.55, ky + .12, .9, .55, .45, .55, "#3a3a3a", "#2b2b2b", "#454545", false) + (() => { const [a, b] = P(kx + 3.8, ky + .57, 1.15); return `<circle cx="${f1(a)}" cy="${f1(b)}" r="1.6" fill="#e76f51"/>`; })() +
        (() => { let m = ""; for (let i = 0; i < 4; i++) { const [mx, my] = P(kx + 1.1 + i * .45, ky + .45, .9); m += `<rect x="${f1(mx - 3)}" y="${f1(my - 6)}" width="6" height="6" rx="1.5" fill="${["#f7f4ee","#e9c46a","#8fae9a","#e07a5f"][i]}"/>`; } return m; })() +
        (() => { const [px, py] = P(kx + .45, ky + .4, .9); return `<rect x="${f1(px - 5)}" y="${f1(py - 7)}" width="10" height="7" rx="2" fill="${C.potW}"/>` + leafBall(px, py - 12, 10, [C.g4, C.g2, C.g1]); })() +
        (() => { const [px, py] = P(kx + 2.9, ky + .4, .9); return `<path d="M${f1(px - 4)},${f1(py)} l1,-8 h6 l1,8z" fill="#d9d4ca"/><path d="M${f1(px - 2)},${f1(py - 10)} q-3,-3 0,-6" stroke="#c0b9ab" fill="none"/>`; })());
      add(kx + 4.6 + ky + .4, box(kx + 4.6, ky, 0, .9, .8, 1.9, "#eeeae2", "#dcd6cb", "#cdc6b9") + (() => { const [a, b] = P(kx + 5.5, ky + .2, 1.5), [c, d] = P(kx + 5.5, ky + .2, 1.0); return `<line x1="${f1(a)}" y1="${f1(b)}" x2="${f1(c)}" y2="${f1(d)}" stroke="#a9a196" stroke-width="2"/>`; })());
      /* 보드게임 테이블 */
      const tx = z.x + 1.9, ty = z.y + 2.9, tw = 3.6, td = 1.7, tz = .72;
      const players = [
        { at:[tx + .9, ty - .4], look:{ skin:4, hair:"ponytail", hairColor:"#2b2220", top:"hoodie", topColor:"#88a9c3", acc:[] }, pose:"cheer" },
        { at:[tx + 2.7, ty - .4], look:{ skin:1, hair:"curly", hairColor:"#b5532f", top:"stripe", topColor:"#3d5a40", stripe:"#efe9dc", acc:["glasses"] }, pose:"think" }
      ];
      players.forEach((p, i) => { const [cx, cy] = P(p.at[0], p.at[1], .8); add(p.at[0] + p.at[1] + .5, chibi({ id:"pl" + i, look:p.look, status:"idle" }, cx, cy, .95, { rot:0, eye:0 }, { pose:p.pose, decor:true })); });
      let t = shadow(tx, ty, tw, td) + box(tx, ty, 0, tw, td, tz, "#d9b58a", "#c49d70", "#b08a5f");
      /* 게임판: 칸이 이어진 길과 색 타일 */
      const bx = tx + .7, by = ty + .3, bw = 2.2, bd = 1.1;
      t += poly([P(bx,by,tz + .01),P(bx + bw,by,tz + .01),P(bx + bw,by + bd,tz + .01),P(bx,by + bd,tz + .01)], "#f6efe0", `stroke="#cdb991" stroke-width="1"`);
      const tile = ["#8fae9a","#e9c46a","#e07a5f","#88a9c3","#c9b79c"];
      for (let i = 0; i < 8; i++) for (let j = 0; j < 4; j++) if ((i === 0 || i === 7 || j === 0 || j === 3) || (i === 3 && j === 2)) {
        const a = bx + .08 + i * .26, b = by + .08 + j * .24;
        t += poly([P(a,b,tz + .02),P(a + .22,b,tz + .02),P(a + .22,b + .2,tz + .02),P(a,b + .2,tz + .02)], tile[(i + j) % 5]);
      }
      const meeple = (x, y, c) => { const [mx, my] = P(x, y, tz); return `<path transform="translate(${f1(mx)},${f1(my)})" d="M-3.4,0 L-2.2,-4.2 L-4.2,-5.4 Q-4.4,-7 -2.4,-6.8 Q-2.6,-9.6 0,-9.8 Q2.6,-9.6 2.4,-6.8 Q4.4,-7 4.2,-5.4 L2.2,-4.2 L3.4,0Z" fill="${c}" stroke="${shade(c, .75)}" stroke-width=".6"/>`; };
      t += meeple(bx + .3, by + .2, "#e07a5f") + meeple(bx + 1.9, by + .25, "#3f6b55") + meeple(bx + 1.3, by + .95, "#e9c46a") + meeple(bx + .2, by + .9, "#88a9c3");
      const [dxp, dyp] = P(tx + .35, ty + 1.2, tz); t += `<g class="die"><rect x="${f1(dxp - 4)}" y="${f1(dyp - 8)}" width="8" height="8" rx="1.8" fill="#fffdf8" stroke="#cfc6b4"/><circle cx="${f1(dxp - 1.6)}" cy="${f1(dyp - 5.6)}" r=".9" fill="#2d2b27"/><circle cx="${f1(dxp + 1.6)}" cy="${f1(dyp - 2.4)}" r=".9" fill="#2d2b27"/><circle cx="${f1(dxp)}" cy="${f1(dyp - 4)}" r=".9" fill="#2d2b27"/></g>`;
      const [cdx, cdy] = P(tx + 3.2, ty + .5, tz); t += [0, 1, 2].map(k => `<rect x="${f1(cdx - 5)}" y="${f1(cdy - 4 - k * 1.6)}" width="10" height="6" rx="1" fill="${k === 2 ? "#e9c46a" : "#fbf7ef"}" stroke="#d6cbb5" stroke-width=".7"/>`).join("");
      add(tx + ty + 2.4, `<g class="hit" data-id="lounge">${t}</g>`);
      /* 앞쪽 의자에 앉은 뒷모습 직원 (카드 들고) */
      { const [cx, cy] = P(tx + 1.8, ty + td + .45, .8); add(tx + ty + td + 2.6, `<g class="hit" data-id="lounge">${chibi({ id:"pl3", look:{ skin:6, hair:"short", hairColor:"#1a1412", top:"tee", topColor:"#e9c46a" }, status:"idle" }, cx, cy, .95, { rot:0, eye:0 }, { back:true, decor:true, cards:true })}</g>`); }
      add(z.x + z.w + z.y + 5, bushPot(z.x + z.w - 1, z.y + 5.0, .55, .45, "t"));
      add(z.x + z.y + 5.4, floorLamp(z.x + .7, z.y + 5.1));
      continue;
    }

    if (z.kind === "garden") {
      /* 그린 라운지: 식물 사다리, 안락의자, 스탠드, 큰 화분들 */
      add(z.x + z.y + 2, plantLadder(z.x + .5, z.y + .3));
      add(z.x + z.y + 3, fiddle(z.x + 2.6, z.y + .5));
      add(z.x + z.y + 5, monstera(z.x + 4.0, z.y + .8, 1.2, "g"));
      add(z.x + z.y + 7.4, tallTree(z.x + 6.6, z.y + .6, "w"));
      const ax = z.x + 3.0, ay = z.y + 2.8;
      add(ax + ay + 1.4, shadow(ax, ay, 1.6, 1.3) + box(ax, ay, 0, 1.6, 1.3, .45, "#c9d6c5", "#b3c3ae", "#a3b49e") + box(ax, ay, .45, 1.6, .3, .7, "#c9d6c5", "#b3c3ae", "#a3b49e") +
        box(ax, ay + .3, .45, .25, 1.0, .35, "#c9d6c5", "#b3c3ae", "#a3b49e") + box(ax + 1.35, ay + .3, .45, .25, 1.0, .35, "#c9d6c5", "#b3c3ae", "#a3b49e") +
        (() => { const [px, py] = P(ax + .8, ay + .8, .5); return `<rect x="${f1(px - 7)}" y="${f1(py - 6)}" width="14" height="6" rx="2" fill="#f3ead8"/>`; })());
      const [sx, sy] = P(ax + 2.3, ay + .9); add(ax + ay + 3.3, shadow(ax + 2, ay + .6, .6, .6) + `<rect x="${f1(sx - 1)}" y="${f1(sy - 16)}" width="2" height="16" fill="#b9976c"/><ellipse cx="${f1(sx)}" cy="${f1(sy - 16)}" rx="9" ry="4.5" fill="#e0c49a"/><rect x="${f1(sx - 4)}" y="${f1(sy - 22)}" width="8" height="5" rx="1" fill="#88a9c3"/>`);
      add(z.x + z.y + 5.6, floorLamp(z.x + 5.6, z.y + 2.6));
      add(z.x + z.y + 5.5, snake(z.x + .8, z.y + 4.6));
      add(z.x + z.y + 7.2, bushPot(z.x + 2.0, z.y + 5.0, .55, .45, "g"));
      add(z.x + z.y + 11, bushPot(z.x + 6.6, z.y + 4.6, .6, .5, "w"));
      continue;
    }

    /* 부서: 책상을 2개씩 줄지어 배치, 인원이 늘면 줄이 늘어남 */
    const perRow = Math.min(PER, z.slots), totalW = perRow * 2 + (perRow - 1) * 1.2, sx0 = z.x + (z.w - totalW) / 2;
    for (let i = 0; i < z.slots; i++) {
      const r = Math.floor(i / PER), c = i % PER;
      const dx = sx0 + c * 3.2, dy = z.y + 1.5 + r * DROW;
      const m = z.members[i];
      if (!m) { add(dx + dy + 1.5, `<g opacity=".85">${desk(dx, dy, "idle", true)}</g>`); continue; }
      const [cx, cy] = P(dx + 1.0, dy - .35, .85);
      const dir = ceoX > cx ? 1 : -1;
      add(dx + dy + .6, `<g class="hit" data-id="${m.id}">${chibi(m, cx, cy, 1, { rot: f1(-dir * 9), eye: f1(dir * 2.2) })}</g>`);
      add(dx + dy + 1.5, `<g class="hit" data-id="${m.id}">${desk(dx, dy, m.status, false)}</g>`);
      const lbl = m.status === "new" ? `${m.name} · 새 책상` : m.status === "plan" ? m.name : m.status === "idle" ? `${m.name} · 대기` : `${m.name} ${m.status === "ok" ? "✓" : m.status === "warn" ? "!" : m.status === "bad" ? "✕" : "·"} ${m.time || ""}`.trim();
      bubs.push(bubble(cx, cy - 66, m.status, lbl));
      if (selId === m.id) floor += `<ellipse cx="${f1(P(dx + 1, dy + .2)[0])}" cy="${f1(P(dx + 1, dy + .2)[1])}" rx="50" ry="23" fill="none" stroke="#3f6b55" stroke-width="2" stroke-dasharray="5 4" opacity=".7"/>`;
    }
  }

  /* 복도 식물: 열과 열 사이, 줄과 줄 사이 */
  for (const r of rows) {
    if (r.length < 2) continue;
    for (let i = 0; i < r.length - 1; i++) {
      const gx = r[i].x + r[i].w + .45, gy = r[i].y;
      add(gx + gy + 1, snake(gx, gy + .6));
    }
  }
  add(1.4 + D - 1.6, monstera(.9, D - 1.6, 1.15));
  add(W - 1.2 + D - 1.4, fiddle(W - 1.2, D - 1.4));

  objs.sort((a, b) => a.depth - b.depth);
  const xs = [P(0, D)[0] - 24, P(W, 0)[0] + 24], ysTop = P(0, 0, WALL)[1] - 50, ysBot = P(W, D)[1] + 34;
  const tint = phase === "night" ? `<rect x="${f1(xs[0])}" y="${f1(ysTop)}" width="${f1(xs[1] - xs[0])}" height="${f1(ysBot - ysTop)}" fill="#3a4a80" opacity=".38" style="mix-blend-mode:multiply" pointer-events="none"/>`
    : phase === "dusk" ? `<rect x="${f1(xs[0])}" y="${f1(ysTop)}" width="${f1(xs[1] - xs[0])}" height="${f1(ysBot - ysTop)}" fill="#f0a070" opacity=".18" style="mix-blend-mode:multiply" pointer-events="none"/>` : "";
  const pools = (floor.match(/<ellipse class="pool"[^>]*\/>/g) || []).join("");
  const glow = phase === "day" ? "" : `<g style="mix-blend-mode:screen" opacity="${phase === "night" ? .9 : .5}" pointer-events="none">${pools}</g>`;
  const svg = $("iso");
  svg.setAttribute("viewBox", `${f1(xs[0])} ${f1(ysTop)} ${f1(xs[1] - xs[0])} ${f1(ysBot - ysTop)}`);
  svg.innerHTML = back + floor.replace(/<ellipse class="pool"[^>]*\/>/g, "") + objs.map(o => o.svg).join("") + tint + glow + bubs.join("");
  svg.querySelectorAll(".hit").forEach(g => g.addEventListener("click", () => select(g.dataset.id)));
  $("scene").dataset.phase = phase;
  const now = new Date();
  $("clock").textContent = `${{ day:"낮", dusk:"저녁", night:"밤" }[phase]} · ${phaseMode === "auto" ? `지금 ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}` : "미리보기"}`;
  document.querySelectorAll("#phaseSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.p === phaseMode)));
}

function chain(id) {
  const down = new Set([id]), up = new Set([id]); let grow = true;
  /* 대표·게시처럼 여러 갈래가 모이는 칸은 그 갈래(via)가 켜졌을 때만 다음 칸으로 이어진다 */
  while (grow) { grow = false; for (const [a, b, , , via] of FLOW.edges) {

}

  let edges = "", labels = "";

    let d, mx, my;

function flowLinks(id) {
  const name = x => { const n = flowNodes().find(v => v.id === x); return n ? (n.kind === "staff" ? `${n.p.name} (${n.p.role})` : n.title) : x; };

  return `<dt>받는 곳</dt><dd>${ins.map(esc).join("<br>") || "없음"}</dd><dt>보내는 곳</dt><dd>${outs.map(esc).join("<br>") || "없음"}</dd>`;
}
function flowPick(id) {
  flowSel = flowSel === id ? null : id;
  if (flowSel) {
    const n = flowNodes().find(v => v.id === id);
    if (n && n.kind === "staff") select(id);
    else if (n) $("detail").innerHTML = `<div class="detail-top"><h2>${esc(n.title)}</h2><span class="pill idle"><span class="dot"></span>${(FK[n.kind] || [""])[0]}</span></div>
      <div style="font-weight:600">${esc(n.sub || "")}</div><p style="margin:8px 0 0">${esc(n.desc || "")}</p><dl class="kv">${flowLinks(id)}</dl>`;
  }
  renderFlow();
}

  sc.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse" || e.target.closest(".fnode")) return; drag = { x:e.clientX, y:e.clientY, l:sc.scrollLeft, t:sc.scrollTop, moved:false }; });

/* ===== 대표 결재함: 관제실(control-room.ps1)이 켜져 있을 때만 버튼이 동작 ===== */
const GROUPS = [["블로그",1,3,1],["보드라이프",4,6,2],["카페",7,9,1]];
const ERR_KO = { "too many picks in one group":"한 갈래에서는 하나만 고를 수 있어요 (보드라이프는 두 개까지).", "file not found":"파일을 찾지 못했어요. 새로고침해 보세요.", "empty reaction":"반응을 한 줄 적어 주세요.", "not a final draft":"최종본 파일이 아니에요." };
async function api(path, body) {
  const r = await fetch(path, body ? { method:"POST", headers:{ "X-Office":"1", "Content-Type":"application/json" }, body:JSON.stringify(body) } : { cache:"no-store" });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(ERR_KO[j.error] || (String(j.error || "").startsWith("no matching") ? "이미 결재된 후보예요. 새로고침해 보세요." : `처리하지 못했어요 (${j.error || r.status})`));
  return j;
}
function ctrlOff() {
  $("ctrlRoom").innerHTML = `<div class="ctrl-head"><h2>대표 결재함</h2><span class="pill idle"><span class="dot"></span>관제실 꺼짐</span></div>
    <p class="ctrl-off">주제 결재, 게시 완료, 최종본 열기 버튼은 <b>집 PC에서 관제실을 켰을 때</b> 나타나요. 사무실 폴더의 <span class="file">관제실-열기.bat</span>을 더블클릭하면 이 화면이 관제실 주소로 다시 열려요. 밖에서는 웹 대화로 "보드게임 2, 5, 8번"이라고 말해도 돼요.</p>`;
}
async function renderCtrl(msg) {

  }).join("");
  const fins = (fn.items || []);
  $("ctrlRoom").innerHTML = `<div class="ctrl-head"><h2>대표 결재함</h2><span class="pill ok"><span class="dot"></span>관제실 켜짐 · 이 PC에서만</span></div>
    <div class="ctrl-cols">
      <div><h3>① 주제 결재 ${tp.date ? `<span class="sub">(${esc(tp.date)} 회의 후보)</span>` : ""}</h3>

          : `<p class="ctrl-off">결재할 주제 후보가 없어요. Mina의 다음 회의는 월·목 아침이에요.</p>`}
      </div>
      <div><h3>②③ 최종본 · 게시 완료 · 반응</h3>
        ${fins.length ? fins.map((f, i) => `<div class="fin" data-i="${i}">
          <div class="fin-top"><span class="pill idle">${esc(f.medium)}</span><b>${esc(f.folder)}</b>${f.posted ? `<span class="pill ok"><span class="dot"></span>게시함</span>` : ""}</div>
          <div class="fin-row"><button class="btn" type="button" data-act="open">메모장으로 열기</button>${f.posted ? "" : `<button class="btn main" type="button" data-act="posted">게시함</button>`}</div>
          <div class="fin-row"><input id="react-${i}" maxlength="120" placeholder="반응 한 줄 (예: 공감 12, 댓글 3)"><button class="btn" type="button" data-act="react">반응 저장</button></div></div>`).join("")
          : `<p class="ctrl-off">아직 최종본이 없어요. 주제를 결재하면 다음 날 아침 초안 → 검토 → 최종본이 생겨요.</p>`}

  const sync = () => {
    document.querySelectorAll("#ctrlRoom .grp").forEach(g => {

    return picked;

    catch (e) { $("pickMsg").textContent = e.message; $("pickMsg").classList.add("err"); $("pickGo").disabled = false; }

      if (act === "posted") { await api("/api/posted", { folder: f.folder, file: f.file, medium: f.medium, reaction: txt }); return renderCtrl(["finMsg", `게시 기록에 적었어요${txt ? " (반응도 저장)" : ""}.`]); }
      if (act === "react") { await api("/api/reaction", { medium: f.medium, title: f.folder, text: txt }); return renderCtrl(["finMsg", "반응을 저장했어요. 일요일 주간 보고에 들어가요."]); }
    } catch (e) { $("finMsg").textContent = e.message; $("finMsg").classList.add("err"); }
  }));
}
