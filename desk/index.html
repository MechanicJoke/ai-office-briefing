*{box-sizing:border-box}
html,body{margin:0}

/* layout: one 640px reading column like a morning paper; summary strip first, then MJ lesson, core 3 as cards, scan list grouped by desk colour */
:root{

  --accent:#1d5c4f; --accent-ink:#ffffff;

  --up:#c8323a; --down:#2a62c9;

  --pol:#d99bc6; --pol-bg:#2c2029; --fin:#7cc8b5; --fin-bg:#1c2b27; --eco:#e0b46a; --eco-bg:#2c2519;
  --other-bg:#1f2330; --other-line:#6f7ca0; --kr-bg:#2a2518; --kr-line:#b8933c;
  --up:#ff7b80; --down:#7aa7ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --paper:#1a211e; --ink:#e8edeb; --muted:#9ca8a3; --line:#2c3632; --soft:#202925;
  --accent:#7cc8b5; --accent-ink:#0e1412;
  --pol:#d99bc6; --pol-bg:#2c2029; --fin:#7cc8b5; --fin-bg:#1c2b27; --eco:#e0b46a; --eco-bg:#2c2519;
  --other-bg:#1f2330; --other-line:#6f7ca0; --kr-bg:#2a2518; --kr-line:#b8933c;
  --up:#ff7b80; --down:#7aa7ff; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:640px;margin:0 auto;padding-block:24px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:28px}
p{margin:0}
strong.num{font-variant-numeric:tabular-nums;font-weight:700}
.up{color:var(--up)} .down{color:var(--down)}

/* masthead */
.mast{display:grid;gap:6px;border-bottom:3px double var(--line);padding-bottom:16px}
.mast .kicker{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;color:var(--muted)}
.mast h1{font-family:var(--display);font-size:2.1rem;line-height:1.2;margin:0}
.mast .date{font-size:.95rem;color:var(--muted)}
.archive{display:flex;flex-wrap:wrap;gap:6px;font-size:.8rem}
.archive a{color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.archive a[aria-current]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* today in 3 lines */
.toc{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:10px}
.toc h2{font-size:.78rem;letter-spacing:.1em;color:var(--muted);margin:0;font-weight:600}
.toc a{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;color:var(--ink);text-decoration:none;font-weight:600;line-height:1.5}
.toc a:hover .t{text-decoration:underline}
.chip{display:inline-block;font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap;letter-spacing:.02em}
.chip.pol{background:var(--pol-bg);color:var(--pol)} .chip.fin{background:var(--fin-bg);color:var(--fin)} .chip.eco{background:var(--eco-bg);color:var(--eco)}

/* section headings */
.sec-h{display:flex;align-items:center;gap:10px;margin:0;font-size:1.05rem}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* MJ lesson */
.mj{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mj-top{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);padding:10px 16px;border-bottom:1px solid var(--line)}
.mj-top .id{font-family:var(--mono);font-size:.78rem;color:var(--muted);letter-spacing:.08em}
.mj-body{padding:16px 18px 18px;display:grid;gap:14px}
.mj-body h3{font-family:var(--display);font-size:1.35rem;line-height:1.4;margin:0;text-wrap:balance}
.mj .oneline{background:var(--fin-bg);color:var(--ink);border-radius:8px;padding:10px 14px;font-weight:600}
.mj .oneline b{color:var(--fin);margin-right:6px}
.mj .end{font-family:var(--mono);font-size:.85rem;color:var(--muted);text-align:right}

/* core cards */
.cards{display:grid;gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px;scroll-margin-top:16px;min-width:0}
.card-head{display:grid;gap:8px}
.card-head .meta{display:flex;align-items:center;gap:8px;justify-content:space-between}
.card-head .n{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.card h3{font-size:1.2rem;line-height:1.45;margin:0;text-wrap:balance}
.lead{font-size:1rem}
.box{border-radius:8px;padding:12px 14px;display:grid;gap:4px;font-size:.95rem;border-left:4px solid}
.box .lbl{font-size:.78rem;font-weight:700;letter-spacing:.04em}
.box.other{background:var(--other-bg);border-color:var(--other-line)}
.box.other .lbl{color:var(--other-line)}
.box.kr{background:var(--kr-bg);border-color:var(--kr-line)}
.box.kr .lbl{color:var(--kr-line)}
.src{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.78rem;color:var(--muted)}
.src span{border:1px solid var(--line);border-radius:999px;padding:1px 9px}

/* scan */
.scan{display:grid;gap:18px}
.scan-group{display:grid;gap:10px}
.scan-group ul{list-style:none;margin:0;padding:0;display:grid;gap:0;background:var(--paper);border:1px solid var(--line);border-radius:12px}
.scan-group li{padding:12px 16px;display:grid;gap:3px;font-size:.95rem;line-height:1.6}
.scan-group li + li{border-top:1px solid var(--line)}
.scan-group .hl{font-weight:700}
.scan-group .rest{color:var(--muted)}
.scan-group .s{font-size:.75rem;color:var(--muted)}

footer{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

/* alert & notes */
.alert{background:var(--paper);border:2px solid var(--up);border-radius:12px;padding:16px 18px;display:grid;gap:10px}
.alert .lbl{color:var(--up);font-weight:700;font-size:.85rem;letter-spacing:.04em}
.alert h3{margin:0;font-size:1.15rem;line-height:1.45;text-wrap:balance}
.late{font-size:.85rem;color:var(--muted);background:var(--soft);border-radius:8px;padding:8px 12px}
.src a{color:var(--muted)}
.empty{color:var(--muted);font-size:.95rem}

.lessons{list-style:none;margin:0;padding:0;display:grid;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lessons li{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:10px 12px;font-size:.93rem;line-height:1.5}
.lessons li+li{border-top:1px solid var(--line)}
.lessons .ld{font-family:var(--mono);font-size:.78rem;color:var(--muted);padding-top:3px}
.lessons .lo{display:block;color:var(--muted);font-size:.86rem}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem;font-weight:700}
.flow span{background:var(--fin-bg);color:var(--fin);border-radius:999px;padding:3px 10px}
.flow i{font-style:normal;color:var(--muted)}
.week{font-size:.9rem;color:var(--muted)}
.news{display:grid;gap:14px}
.news .card h3{font-size:1.12rem}
.news .when{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.news a.more{font-size:.85rem;color:var(--accent);text-decoration:none;font-weight:600}
.ind-big{display:grid;gap:14px}
.ind{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;grid-template-columns:1fr 132px;gap:6px 14px;align-items:center}
.ind .nm{font-weight:700;font-size:1rem;grid-column:1/-1;display:flex;justify-content:space-between;gap:8px}
.ind .nm .code{font-family:var(--mono);font-size:.72rem;color:var(--muted);font-weight:500}
.ind .val{font-size:1.9rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.ind .val small{font-size:.9rem;color:var(--muted);font-weight:500;margin-left:4px}
.ind .chg{font-weight:700;font-variant-numeric:tabular-nums}
.ind .from{font-size:.8rem;color:var(--muted);white-space:nowrap}
.ind .mean{grid-column:1/-1;font-size:.92rem;background:var(--soft);border-radius:8px;padding:8px 12px}
.ind svg{grid-row:2;grid-column:2;width:132px;height:52px;overflow:visible}
.ind .line{grid-column:1/-1}
.rest{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:.9rem}
.rest td{padding:9px 12px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.rest tr:first-child td{border-top:0}
.rest td:nth-child(2),.rest td:nth-child(3){text-align:right;white-space:nowrap}
.rest td:first-child{line-height:1.35}
.rest .c{font-family:var(--mono);font-size:.7rem;color:var(--muted);display:block}
.sched{list-style:none;margin:0;padding:0;background:var(--paper);border:1px solid var(--line);border-radius:12px}
.sched li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 16px;font-size:.95rem}
.sched li+li{border-top:1px solid var(--line)}
.sched .d{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.sched .s{display:block;font-size:.78rem;color:var(--muted)}
.flat{color:var(--muted)}

.news .more{font-size:.85rem;color:var(--accent);text-decoration:none;font-weight:600}

/* desk only */
button{font:inherit;font-weight:600;border:0;border-radius:8px;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.copy-sm{background:var(--soft);color:var(--ink);border:1px solid var(--line);font-size:.78rem;padding:5px 10px}
.deskbar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.deskbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1.7fr 1fr 1fr 1fr;gap:6px}
.deskbar button{font-size:.82rem;padding:10px 6px;white-space:nowrap}
.deskbar .main{background:var(--kakao);color:var(--kakao-ink)}
.deskbar .alt{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.desk-note{background:var(--soft);border:1px dashed var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.desk-note h2{font-size:.85rem;margin:0}
.desk-note pre{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-family:var(--sans);font-size:.85rem;margin:0;max-height:320px;overflow:auto;background:var(--paper);border-radius:8px;padding:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:.9rem;z-index:6}
</style>

(function () {

/* ───── 화면 ───── */

/* 숫자 강조: +는 빨강(상승), -는 파랑(하락), 큰 숫자는 굵게. 숫자 자체는 바꾸지 않는다 */

if (mj) h += sec("🤖 MJ 경제 수업", '<article class="mj"><div class="mj-top"><span class="id">MJ-01 · ECONOMY CLASS' + (mj.no ? " · #" + esc(mj.no) : "") + '</span>' + copyBtn("mj") + '</div><div class="mj-body"><h3>' + esc(mj.title) + '</h3>' +
  mj.paras.map(function (p) { return '<p>' + nums(p) + '</p>'; }).join("") +
  '<p class="oneline"><b>오늘의 한 줄</b>' + esc(mj.oneline) + '</p><p class="end">' + esc(mj.end || "학습 종료.") + '</p></div></article>');
if (core.length) h += sec("🌍 해외 특파원 데스크 · 핵심 " + core.length, '<div class="cards">' + core.map(function (c, i) {
  return '<article class="card" id="core-' + (i + 1) + '"><div class="card-head"><div class="meta"><span>' + chip(c.tag) + ' <span class="n">' + NUM[i] + '</span></span>' + copyBtn("c" + i) + '</div><h3>' + esc(c.title) + '</h3></div>' +
    '<p class="lead">' + nums(c.body) + '</p>' +
    (c.other ? '<div class="box other"><span class="lbl">⚖️ 다른 시각</span><p>' + nums(c.other) + '</p></div>' : "") +
    (c.korea ? '<div class="box kr"><span class="lbl">🇰🇷 한국엔? · 해석</span><p>' + nums(c.korea) + '</p></div>' : "") +
    srcChips(c.src, c.links) + '</article>';
}).join("") + '</div>');
else h += sec("🌍 해외 특파원 데스크", '<p class="empty">오늘은 큰 해외 소식이 없어요.</p>');
if (scan.length) h += sec("☞ 훑어보기", '<div class="scan">' + scan.map(function (s) {
  return '<div class="scan-group"><div>' + chip(s.sec) + '</div><ul>' + s.items.map(function (it) {
    return '<li><span class="hl">' + nums(it.head) + '</span>' + ((it.points || []).length ? '<span class="rest">' + it.points.map(nums).join(" · ") + '</span>' : "") + '<span class="s">' + esc(it.src) + '</span></li>';
  }).join("") + '</ul></div>';
}).join("") + '</div>');
}
if (MODE === "desk") h += '<section class="desk-note"><h2>📋 마지막으로 복사한 글 (카톡에 붙으면 이 모양)</h2><pre id="preview">아래 버튼을 누르면 복사된 글이 여기 그대로 보입니다.</pre></section>';
h += '<footer>' + (WEEKLY ? '지표는 FRED(미국 세인트루이스 연은), 뉴스는 해외 매체 기사를 바탕으로 새로 요약했습니다. 미니 그래프는 최근 관측값 8개. ' : '해외 매체 기사를 바탕으로 새로 요약한 글입니다. ') + '숫자는 원문 그대로이며, 투자 권유가 아닙니다. 상승은 빨강, 하락은 파랑으로 표시합니다.' + (MODE === "desk" ? "" : ' · <a href="' + SITE + 'archive.html" style="color:inherit">지난 브리핑</a>') + '</footer>';
document.getElementById("app").innerHTML = h;

document.addEventListener("click", function (e) {
  var j = e.target.closest && e.target.closest("[data-jump]");
  if (j) { e.preventDefault(); var t = document.getElementById(j.getAttribute("data-jump")); if (t) t.scrollIntoView({behavior: window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }
});

if (MODE !== "desk") return;
var bar = document.createElement("div");
bar.innerHTML = '<div class="deskbar"><div class="in">' +
  '<button type="button" class="main" data-copy="link">🔗 공유 링크 복사</button>' +
  '<button type="button" class="alt" data-copy="all">전체 글</button>' +
  (WEEKLY ? '<button type="button" class="alt" data-copy="news">3대 뉴스</button>' + '<button type="button" class="alt" data-copy="review">MJ 복습</button>'
          : '<button type="button" class="alt" data-copy="core">핵심 ' + core.length + '</button>' + '<button type="button" class="alt" data-copy="scan">훑어보기</button>') + '</div></div><div class="toast" id="toast" hidden></div>';
document.body.appendChild(bar);
var toast = document.getElementById("toast");
function show(m) { toast.textContent = m; toast.hidden = false; clearTimeout(show.t); show.t = setTimeout(function () { toast.hidden = true; }, 1800); }
function fallback(t) { var a = document.createElement("textarea"); a.value = t; a.setAttribute("readonly", ""); a.style.position = "fixed"; a.style.opacity = "0"; document.body.appendChild(a); a.select(); a.setSelectionRange(0, t.length); var ok = false; try { ok = document.execCommand("copy"); } catch (_) {} document.body.removeChild(a); return ok; }
document.addEventListener("click", function (e) {
  var b = e.target.closest && e.target.closest("[data-copy]"); if (!b) return;
  var t = texts[b.getAttribute("data-copy")]();
  document.getElementById("preview").textContent = t;
  function ok() { show("복사됐어요. 카톡에 붙여넣으세요"); }
  function no() { if (fallback(t)) ok(); else show("자동 복사가 막혔어요. 미리보기 글을 길게 눌러 복사하세요"); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, no); else no();
});
})();
</script>
