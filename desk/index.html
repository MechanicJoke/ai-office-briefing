p{margin:0}

.up{color:var(--up)} .down{color:var(--down)}

/* masthead */
.mast{display:grid;gap:6px;border-bottom:3px double var(--line);padding-bottom:16px}
.mast .kicker{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;color:var(--muted)}
.mast h1{font-family:var(--display);font-size:2.1rem;line-height:1.2;margin:0}
.mast .date{font-size:.95rem;color:var(--muted)}
.archive{display:flex;flex-wrap:wrap;gap:6px;font-size:.8rem}
.archive a{color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.archive a[aria-current]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* today in 3 lines */
.toc{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:10px}
.toc h2{font-size:.78rem;letter-spacing:.1em;color:var(--muted);margin:0;font-weight:600}
.toc a{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;color:var(--ink);text-decoration:none;font-weight:600;line-height:1.5}
.toc a:hover .t{text-decoration:underline}
.chip{display:inline-block;font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap;letter-spacing:.02em}
.chip.pol{background:var(--pol-bg);color:var(--pol)} .chip.fin{background:var(--fin-bg);color:var(--fin)} .chip.eco{background:var(--eco-bg);color:var(--eco)}

/* section headings */
.sec-h{display:flex;align-items:center;gap:10px;margin:0;font-size:1.05rem}
.sec-h::after{content:"";flex:1;height:1px;background:var(--line)}

/* MJ lesson */
.mj{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mj-top{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);padding:10px 16px;border-bottom:1px solid var(--line)}

.mj-body{padding:16px 18px 18px;display:grid;gap:14px}
.mj-body h3{font-family:var(--display);font-size:1.35rem;line-height:1.4;margin:0;text-wrap:balance}
.mj .oneline{background:var(--fin-bg);color:var(--ink);border-radius:8px;padding:10px 14px;font-weight:600}
.mj .oneline b{color:var(--fin);margin-right:6px}
.mj .end{font-family:var(--mono);font-size:.85rem;color:var(--muted);text-align:right}

/* core cards */
.cards{display:grid;gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px;scroll-margin-top:16px;min-width:0}
.card-head{display:grid;gap:8px}
.card-head .meta{display:flex;align-items:center;gap:8px;justify-content:space-between}
.card-head .n{font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.card h3{font-size:1.2rem;line-height:1.45;margin:0;text-wrap:balance}
.lead{font-size:1rem}
.box{border-radius:8px;padding:12px 14px;display:grid;gap:4px;font-size:.95rem;border-left:4px solid}
.box .lbl{font-size:.78rem;font-weight:700;letter-spacing:.04em}

.box.kr{background:var(--kr-bg);border-color:var(--kr-line)}
.box.kr .lbl{color:var(--kr-line)}
.src{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.78rem;color:var(--muted)}
.src span{border:1px solid var(--line);border-radius:999px;padding:1px 9px}

.scan{display:grid;gap:18px}
.scan-group{display:grid;gap:10px}

.empty{color:var(--muted);font-size:.95rem}

.ind .line{grid-column:1/-1}

.sched .s{display:block;font-size:.78rem;color:var(--muted)}

</style>

  if (sched.length) h += sec("📅 다음 주와 그 뒤 일정", '<ul class="sched">' + sched.map(function (s) { return '<li><span class="d">' + esc(s.d) + '</span><span>' + esc(s.what) + (s.s ? '<span class="s">' + esc(s.s) + '</span>' : '') + '</span></li>'; }).join("") + '</ul>');
  if (review) h += sec("🤖 MJ 주간 복습", '<article class="mj"><div class="mj-top"><span class="id">MJ-01 · WEEKLY REVIEW</span>' + copyBtn("review") + '</div><div class="mj-body"><h3>이번 주 배운 ' + review.lessons.length + '가지</h3><ol class="lessons">' + review.lessons.map(function (l) { var href = dayHref(l.date); return '<li><span class="ld">' + esc(l.when) + '</span><span><b>' + (href ? '<a href="' + esc(href) + '" style="color:inherit">' + esc(l.title) + '</a>' : esc(l.title)) + '</b><span class="lo">' + esc(l.oneline) + '</span></span></li>'; }).join("") + '</ol>' +
    ((review.flow || []).length ? '<div class="flow" aria-label="개념 연결">' + review.flow.map(function (f) { return '<span>' + esc(f) + '</span>'; }).join('<i>→</i>') + '</div>' : '') +
    review.paras.map(function (p) { return '<p>' + nums(p) + '</p>'; }).join("") + '<p class="oneline"><b>이번 주 한 줄</b>' + esc(review.oneline) + '</p><p class="end">' + esc(review.end || "학습 종료.") + '</p></div></article>');
} else {
if (core.length) h += '<section class="toc" aria-label="오늘 요약"><h2>오늘 ' + core.length + '줄 요약</h2>' + core.map(function (c, i) {
  return '<a href="#core-' + (i + 1) + '" data-jump="core-' + (i + 1) + '">' + chip(c.tag) + '<span class="t">' + esc(c.title) + '</span></a>';
}).join("") + '</section>';
if (mj) h += sec("🤖 MJ 경제 수업", '<article class="mj"><div class="mj-top"><span class="id">MJ-01 · ECONOMY CLASS' + (mj.no ? " · #" + esc(mj.no) : "") + '</span>' + copyBtn("mj") + '</div><div class="mj-body"><h3>' + esc(mj.title) + '</h3>' +
  mj.paras.map(function (p) { return '<p>' + nums(p) + '</p>'; }).join("") +
  '<p class="oneline"><b>오늘의 한 줄</b>' + esc(mj.oneline) + '</p><p class="end">' + esc(mj.end || "학습 종료.") + '</p></div></article>');
if (core.length) h += sec("🌍 해외 특파원 데스크 · 핵심 " + core.length, '<div class="cards">' + core.map(function (c, i) {
  return '<article class="card" id="core-' + (i + 1) + '"><div class="card-head"><div class="meta"><span>' + chip(c.tag) + ' <span class="n">' + NUM[i] + '</span></span>' + copyBtn("c" + i) + '</div><h3>' + esc(c.title) + '</h3></div>' +
    '<p class="lead">' + nums(c.body) + '</p>' +
    (c.other ? '<div class="box other"><span class="lbl">⚖️ 다른 시각</span><p>' + nums(c.other) + '</p></div>' : "") +
    (c.korea ? '<div class="box kr"><span class="lbl">🇰🇷 한국엔? · 해석</span><p>' + nums(c.korea) + '</p></div>' : "") +
    srcChips(c.src, c.links) + '</article>';
}).join("") + '</div>');
else h += sec("🌍 해외 특파원 데스크", '<p class="empty">오늘은 큰 해외 소식이 없어요.</p>');
if (scan.length) h += sec("☞ 훑어보기", '<div class="scan">' + scan.map(function (s) {
  return '<div class="scan-group"><div>' + chip(s.sec) + '</div><ul>' + s.items.map(function (it) {
    return '<li><span class="hl">' + nums(it.head) + '</span>' + ((it.points || []).length ? '<span class="rest">' + it.points.map(nums).join(" · ") + '</span>' : "") + '<span class="s">' + esc(it.src) + '</span></li>';
  }).join("") + '</ul></div>';
}).join("") + '</div>');
}
if (MODE === "desk") h += '<section class="desk-note"><h2>📋 마지막으로 복사한 글 (카톡에 붙으면 이 모양)</h2><pre id="preview">아래 버튼을 누르면 복사된 글이 여기 그대로 보입니다.</pre></section>';
h += '<footer>' + (WEEKLY ? '지표는 FRED(미국 세인트루이스 연은), 뉴스는 해외 매체 기사를 바탕으로 새로 요약했습니다. 미니 그래프는 최근 관측값 8개. ' : '해외 매체 기사를 바탕으로 새로 요약한 글입니다. ') + '숫자는 원문 그대로이며, 투자 권유가 아닙니다. 상승은 빨강, 하락은 파랑으로 표시합니다.' + (MODE === "desk" ? "" : ' · <a href="' + SITE + 'archive.html" style="color:inherit">지난 브리핑</a>') + '</footer>';
document.getElementById("app").innerHTML = h;

document.addEventListener("click", function (e) {
  var j = e.target.closest && e.target.closest("[data-jump]");
  if (j) { e.preventDefault(); var t = document.getElementById(j.getAttribute("data-jump")); if (t) t.scrollIntoView({behavior: window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }
});

if (MODE !== "desk") return;
var bar = document.createElement("div");
bar.innerHTML = '<div class="deskbar"><div class="in">' +
  '<button type="button" class="main" data-copy="link">🔗 공유 링크 복사</button>' +
  '<button type="button" class="alt" data-copy="all">전체 글</button>' +
  (WEEKLY ? '<button type="button" class="alt" data-copy="news">3대 뉴스</button>' + '<button type="button" class="alt" data-copy="review">MJ 복습</button>'
          : '<button type="button" class="alt" data-copy="core">핵심 ' + core.length + '</button>' + '<button type="button" class="alt" data-copy="scan">훑어보기</button>') + '</div></div><div class="toast" id="toast" hidden></div>';
document.body.appendChild(bar);
var toast = document.getElementById("toast");
function show(m) { toast.textContent = m; toast.hidden = false; clearTimeout(show.t); show.t = setTimeout(function () { toast.hidden = true; }, 1800); }
function fallback(t) { var a = document.createElement("textarea"); a.value = t; a.setAttribute("readonly", ""); a.style.position = "fixed"; a.style.opacity = "0"; document.body.appendChild(a); a.select(); a.setSelectionRange(0, t.length); var ok = false; try { ok = document.execCommand("copy"); } catch (_) {} document.body.removeChild(a); return ok; }
document.addEventListener("click", function (e) {
  var b = e.target.closest && e.target.closest("[data-copy]"); if (!b) return;
  var t = texts[b.getAttribute("data-copy")]();
  document.getElementById("preview").textContent = t;
  function ok() { show("복사됐어요. 카톡에 붙여넣으세요"); }
  function no() { if (fallback(t)) ok(); else show("자동 복사가 막혔어요. 미리보기 글을 길게 눌러 복사하세요"); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, no); else no();
});
})();
</script>
</body>
