<script>
/* 경제 한입 공유판·관리데스크 공통 틀 (scripts/share-template.html)
   MODE: "reader" = 지인용 읽기 전용, "desk" = 대표님 관리 화면(복사 버튼)
   내용은 reports/DATE/briefing-data.json 이 그대로 들어온다. 이 틀은 매일 고치지 않는다. */
(function () {
var MODE = "reader";
var SITE = "https://mechanicjoke.github.io/ai-office-briefing/";
var D = JSON.parse(document.getElementById("brief-data").textContent);
var ARCH = JSON.parse(document.getElementById("brief-archive").textContent || "[]");
var LINE = "━━━━━━━━━━━━";
var NUM = ["1️⃣","2️⃣","3️⃣","4️⃣","5️⃣"];
var DESK = {"국제 정치":"pol","국제 금융":"fin","국제 경제":"eco"};
var PAGE = SITE + D.date + "/";
var core = D.core || [], scan = D.scan || [], mj = D.mj || null, alert = D.alert || null;

/* ───── 복사용 원고: 화면 디자인과 따로 만든다 (문단마다 빈 줄 1개, 문장 중간 줄바꿈 없음, 이모지 유지) ───── */
function srcText(s) { return (s || []).join(" · "); }
function alertText() { return alert ? ["🚨 특보 | (" + alert.tag + ") " + alert.title, "→ " + alert.body, "📰 출처: " + srcText(alert.src)].join("\n\n") : ""; }
function mjText() { return mj ? ["🤖 MJ 경제 수업 | " + mj.title].concat(mj.paras, ["오늘의 한 줄: " + mj.oneline, mj.end || "학습 종료."]).join("\n\n") : ""; }
function coreText(c, i) {
  var a = [NUM[i] + " (" + c.tag + ") " + c.title, "→ " + c.body];
  if (c.other) a.push("⚖️ 다른 시각: " + c.other);
  if (c.korea) a.push("🇰🇷 한국엔?(해석): " + c.korea);
  a.push("📰 출처: " + srcText(c.src));
  return a.join("\n\n");
}
function coreAll() { return "【오늘의 핵심 " + core.length + "】\n\n" + core.map(coreText).join("\n\n" + LINE + "\n\n"); }
function scanLine(it) { return "☞ " + [it.head].concat(it.points || []).join("...") + " (" + it.src + ")"; }
function scanAll() { return "【훑어보기】\n\n" + scan.map(function (s) { return "《" + s.sec + "》\n" + s.items.map(scanLine).join("\n\n"); }).join("\n\n"); }
function top() { return "📮 경제 한입 | " + D.dateLabel; }
function deskTop() { return "🌍 해외 특파원 데스크 | " + D.dateLabel; }
function tail() { return "🔗 자세히 보기: " + PAGE; }
function join(parts) { return parts.filter(Boolean).join("\n\n"); }
var texts = {
  link: function () { return top() + "\n" + PAGE; },
  all: function () {
    var p = [top()];
    if (D.late) p.push("(" + D.late + ")");
    if (alert) p.push(LINE, alertText());
    if (mj) p.push(LINE, mjText());
    if (core.length) p.push(LINE, "🌍 해외 특파원 데스크", coreAll());
    if (scan.length) p.push(LINE, scanAll());
    p.push(LINE, tail(), "※ 정리용 자료이며 투자 권유가 아닙니다.");
    return join(p);
  },
  mj: function () { return join([mjText(), tail()]); },
  core: function () { return join([deskTop(), coreAll(), tail()]); },
  scan: function () { return join([deskTop(), scanAll(), tail()]); },
  alert: function () { return join([top(), alertText(), tail()]); }
};
core.forEach(function (c, i) { texts["c" + i] = function () { return join([deskTop(), coreText(c, i), tail()]); }; });

/* ───── 화면 ───── */
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (m) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]; }); }
/* 숫자 강조: +는 빨강(상승), -는 파랑(하락), 큰 숫자는 굵게. 숫자 자체는 바꾸지 않는다 */
function nums(s) {
  return esc(s)
    .replace(/([+＋]\d[\d,.]*%)/g, '<strong class="num up">$1</strong>')
    .replace(/(^|[\s(（])(-\d[\d,.]*%)/g, '$1<strong class="num down">$2</strong>')
    .replace(/(^|[^\w.,>+\-])(\d{1,3}(?:,\d{3})+(?:\.\d+)?)/g, '$1<strong class="num">$2</strong>');
}
function chip(tag) { return '<span class="chip ' + (DESK[tag] || "fin") + '">' + esc(tag) + '</span>'; }
function copyBtn(key) { return MODE === "desk" ? '<button type="button" class="copy-sm" data-copy="' + key + '">이 글 복사</button>' : ""; }
function srcChips(src, links) {
  return '<div class="src">📰 ' + (src || []).map(function (s, i) {
    var u = links && links[i];
    return '<span>' + (u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(s) + '</a>' : esc(s)) + '</span>';
  }).join("") + '</div>';
}
function archiveNav() {
  if (!ARCH.length) return "";
  return '<nav class="archive" aria-label="지난 브리핑">' + ARCH.slice(0, 5).map(function (a) {
    return '<a href="' + esc(a.href) + '"' + (a.date === D.date ? ' aria-current="page"' : "") + '>' + esc(a.label) + '</a>';
  }).join("") + '<a href="' + SITE + 'archive.html">전체 목록</a></nav>';
}
function sec(title, inner) { return '<section style="display:grid;gap:12px"><h2 class="sec-h">' + title + '</h2>' + inner + '</section>'; }

var h = '<header class="mast"><span class="kicker">' + (MODE === "desk" ? "DESK · 대표님 관리 화면" : "MORNING BRIEF") + '</span>' +
  '<h1>📮 경제 한입</h1><span class="date">' + esc(D.dateLabel) + ' · 매일 아침 세계 경제를 쉽게</span>' + archiveNav() + '</header>';
if (D.late) h += '<p class="late">' + esc(D.late) + '</p>';
if (alert) h += '<section class="alert" aria-label="특보"><div class="card-head"><div class="meta"><span class="lbl">🚨 특보 · ' + esc(alert.tag) + '</span>' + copyBtn("alert") + '</div><h3>' + esc(alert.title) + '</h3></div><p>' + nums(alert.body) + '</p>' + srcChips(alert.src, alert.links) + '</section>';
if (core.length) h += '<section class="toc" aria-label="오늘 요약"><h2>오늘 ' + core.length + '줄 요약</h2>' + core.map(function (c, i) {
  return '<a href="#core-' + (i + 1) + '" data-jump="core-' + (i + 1) + '">' + chip(c.tag) + '<span class="t">' + esc(c.title) + '</span></a>';
}).join("") + '</section>';
if (mj) h += sec("🤖 MJ 경제 수업", '<article class="mj"><div class="mj-top"><span class="id">MJ-01 · ECONOMY CLASS' + (mj.no ? " · #" + esc(mj.no) : "") + '</span>' + copyBtn("mj") + '</div><div class="mj-body"><h3>' + esc(mj.title) + '</h3>' +
  mj.paras.map(function (p) { return '<p>' + nums(p) + '</p>'; }).join("") +
  '<p class="oneline"><b>오늘의 한 줄</b>' + esc(mj.oneline) + '</p><p class="end">' + esc(mj.end || "학습 종료.") + '</p></div></article>');
if (core.length) h += sec("🌍 해외 특파원 데스크 · 핵심 " + core.length, '<div class="cards">' + core.map(function (c, i) {
  return '<article class="card" id="core-' + (i + 1) + '"><div class="card-head"><div class="meta"><span>' + chip(c.tag) + ' <span class="n">' + NUM[i] + '</span></span>' + copyBtn("c" + i) + '</div><h3>' + esc(c.title) + '</h3></div>' +
    '<p class="lead">' + nums(c.body) + '</p>' +
    (c.other ? '<div class="box other"><span class="lbl">⚖️ 다른 시각</span><p>' + nums(c.other) + '</p></div>' : "") +
    (c.korea ? '<div class="box kr"><span class="lbl">🇰🇷 한국엔? · 해석</span><p>' + nums(c.korea) + '</p></div>' : "") +
    srcChips(c.src, c.links) + '</article>';
}).join("") + '</div>');
else h += sec("🌍 해외 특파원 데스크", '<p class="empty">오늘은 큰 해외 소식이 없어요.</p>');
if (scan.length) h += sec("☞ 훑어보기", '<div class="scan">' + scan.map(function (s) {
  return '<div class="scan-group"><div>' + chip(s.sec) + '</div><ul>' + s.items.map(function (it) {
    return '<li><span class="hl">' + nums(it.head) + '</span>' + ((it.points || []).length ? '<span class="rest">' + it.points.map(nums).join(" · ") + '</span>' : "") + '<span class="s">' + esc(it.src) + '</span></li>';
  }).join("") + '</ul></div>';
}).join("") + '</div>');
if (MODE === "desk") h += '<section class="desk-note"><h2>📋 마지막으로 복사한 글 (카톡에 붙으면 이 모양)</h2><pre id="preview">아래 버튼을 누르면 복사된 글이 여기 그대로 보입니다.</pre></section>';
h += '<footer>해외 매체 기사를 바탕으로 새로 요약한 글입니다. 숫자는 원문 그대로이며, 투자 권유가 아닙니다. 상승은 빨강, 하락은 파랑으로 표시합니다.' + (MODE === "desk" ? "" : ' · <a href="' + SITE + 'archive.html" style="color:inherit">지난 브리핑</a>') + '</footer>';
document.getElementById("app").innerHTML = h;

document.addEventListener("click", function (e) {
  var j = e.target.closest && e.target.closest("[data-jump]");
  if (j) { e.preventDefault(); var t = document.getElementById(j.getAttribute("data-jump")); if (t) t.scrollIntoView({behavior: window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }
});

if (MODE !== "desk") return;
var bar = document.createElement("div");
bar.innerHTML = '<div class="deskbar"><div class="in">' +
  '<button type="button" class="main" data-copy="link">🔗 공유 링크 복사</button>' +
  '<button type="button" class="alt" data-copy="all">전체 글</button>' +
  '<button type="button" class="alt" data-copy="core">핵심 ' + core.length + '</button>' +
  '<button type="button" class="alt" data-copy="scan">훑어보기</button></div></div><div class="toast" id="toast" hidden></div>';
document.body.appendChild(bar);
var toast = document.getElementById("toast");
function show(m) { toast.textContent = m; toast.hidden = false; clearTimeout(show.t); show.t = setTimeout(function () { toast.hidden = true; }, 1800); }
function fallback(t) { var a = document.createElement("textarea"); a.value = t; a.setAttribute("readonly", ""); a.style.position = "fixed"; a.style.opacity = "0"; document.body.appendChild(a); a.select(); a.setSelectionRange(0, t.length); var ok = false; try { ok = document.execCommand("copy"); } catch (_) {} document.body.removeChild(a); return ok; }
document.addEventListener("click", function (e) {
  var b = e.target.closest && e.target.closest("[data-copy]"); if (!b) return;
  var t = texts[b.getAttribute("data-copy")]();
  document.getElementById("preview").textContent = t;
  function ok() { show("복사됐어요. 카톡에 붙여넣으세요"); }
  function no() { if (fallback(t)) ok(); else show("자동 복사가 막혔어요. 미리보기 글을 길게 눌러 복사하세요"); }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(ok, no); else no();
});
})();
</script>
