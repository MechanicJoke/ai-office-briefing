<style>
:root{--bg:#eef1ef;--paper:#ffffff;--ink:#18201d;--muted:#5b6762;--line:#d6ddd9;--accent:#1d5c4f}
@media (prefers-color-scheme: dark){:root{--bg:#111614;--paper:#1a211e;--ink:#e8edeb;--muted:#9ca8a3;--line:#2c3632;--accent:#7cc8b5;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 "IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:28px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
h1{font-family:"Gowun Batang","Noto Serif KR",serif;font-size:1.9rem;margin:0 0 6px}
p{margin:0 0 18px;color:var(--muted);font-size:.95rem}
ul{list-style:none;padding:0;margin:0;background:var(--paper);border:1px solid var(--line);border-radius:12px}
li+li{border-top:1px solid var(--line)}
a{display:flex;justify-content:space-between;padding:13px 16px;color:var(--ink);text-decoration:none;font-variant-numeric:tabular-nums;font-weight:600}
a span{color:var(--muted);font-weight:400}
a:hover,a:focus-visible{background:var(--bg);outline:none}
</style>
